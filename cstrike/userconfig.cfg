// ==========================================================
// Counter-Strike 1.6 - Configuracion Competitiva & Visual Max
// Repositorio: g:\Projects2\cs16-config
// ==========================================================

// --- Graficos y Rendimiento Ultra Visual Max ---
cl_himodels "1"
r_detailtextures "1"
r_detailtexturemode "2"
gl_dither "0"
gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"
gl_round_down "0"
gl_max_size "1024"
gl_picmip "0"
gl_playermip "0"
gl_ansio "16"
gl_vsync "0"
fps_max "101.0"
cl_corpsestay "600"
mp_decals "300"
r_decals "300"
cl_weather "1"
cl_minmodels "0"
r_dynamic "1"
gl_overbright "1"
gl_overbright_bits "1"
gl_keeptjunctions "1"
gl_lightholes "1"
gl_wateramp "0.2"
r_wateralpha "0.65"
gl_polyoffset "0.1"
gl_cull "1"
gl_smoothmodels "1"
brightness "2.0"
gamma "2.8"
hisound "1"
_snd_mixahead "0.05"

// --- Netcode Competitivo (100 FPS / Buena conexion) ---
rate "25000"
cl_cmdrate "101"
cl_updaterate "101"
cl_cmdbackup "2"
cl_dlmax "1024"
ex_interp "0.01"

// --- Calidad de Vida & Gameplay ---
cl_righthand "1"
hud_fastswitch "1"
_cl_autowepswitch "0"

// --- Consola & HUD Cyberpunk ---
con_color "0 240 255"

// --- Mira Fija Cian Eléctrico Cyberpunk (Optimizada) ---
cl_crosshair_color "0 240 255"
cl_crosshair_size "medium"
cl_crosshair_translucent "0"
cl_dynamiccrosshair "0"

// --- Menu CommandMenu (H) ---
bind "h" "+commandmenu"

// --- Binds de Compra Rapida (F1 - F4) ---
bind "F1" "m4a1; ak47; vesthelm; hegren; flash; flash; defuser"
bind "F2" "awp; deagle; vesthelm; hegren; flash; flash; defuser"
bind "F3" "deagle; vesthelm; hegren; flash; flash; defuser"
bind "F4" "hegren; flash; flash; sgren; defuser"

// --- Binds de Compra Rapida (Teclado Numerico / Numpad) ---
bind "KP_HOME" "m4a1; ak47; vesthelm; hegren; flash; flash; defuser"
bind "KP_UPARROW" "awp; deagle; vesthelm; hegren; flash; flash; defuser"
bind "KP_PGUP" "deagle; vesthelm; hegren; flash; flash; defuser"
bind "KP_LEFTARROW" "hegren; flash; flash; sgren"
bind "KP_5" "vesthelm; vest"
bind "KP_RIGHTARROW" "defuser"
bind "KP_END" "famas; galil; vesthelm; hegren; flash; flash; defuser"
bind "KP_DOWNARROW" "mp5; vesthelm; hegren; flash; flash; defuser"

// ==========================================
// CONFIGURACION LISTA
// ==========================================

echo "=== Config CS 1.6 cargada exitosamente desde userconfig.cfg ==="

