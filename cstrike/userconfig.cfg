// =========================================================
// COUNTER-STRIKE 1.6 - CONFIGURACION OPTIMIZADA Y PERSONALIZADA
// =========================================================

// --- MIRA (CROSSHAIR) ---
cl_crosshair_color "0 255 0"       // Verde fluorescente de alto contraste
cl_crosshair_size "medium"         // Tamano mediano perfecto
cl_crosshair_translucent "0"      // Mira solida 100% visible (sin transparencia)
cl_dynamiccrosshair "0"            // Mira fija al correr/saltar

// --- JUGABILIDAD Y ARMAS ---
cl_righthand "1"                   // Arma en mano derecha
hud_fastswitch "1"                 // Cambio rapido de arma sin confirmacion de clic
_cl_autowepswitch "0"              // NO cambiar al arma del suelo automaticamente en combate
hud_centerid "1"                   // Nombres de jugadores centrados en pantalla

// --- NETCODE Y RENDIMIENTO (100 FPS) ---
fps_max "101.0"                    // Limite a 101 FPS constante
fps_modem "0"
developer "0"
rate "25000"                       // Ancho de banda optimo
cl_cmdrate "101"                   // Paquetes enviados al servidor por segundo
cl_updaterate "101"                // Paquetes recibidos del servidor por segundo
cl_cmdbackup "2"
ex_interp "0.01"                   // Interpolacion precisa para mejor registro de disparos

// --- BINDS DE COMPRA RAPIDA (TECLAS F1 - F4) ---
bind "F1" "m4a1; ak47; primammo; vesthelm; vest; hegren; flash; flash; defuser"
bind "F2" "awp; primammo; vesthelm; vest; deagle; secammo; hegren; flash; flash; defuser"
bind "F3" "deagle; secammo; vesthelm; vest; hegren; flash; flash; defuser"
bind "F4" "hegren; flash; flash; sgren; defuser"

// --- BINDS DE COMPRA RAPIDA (TECLADO NUMERICO) ---
bind "KP_HOME" "m4a1; ak47; primammo; vesthelm; vest; hegren; flash; flash"
bind "KP_UPARROW" "awp; primammo; vesthelm; vest; deagle; secammo; hegren; flash; flash"
bind "KP_PGUP" "deagle; secammo; vesthelm; vest; hegren; flash; flash"
bind "KP_LEFTARROW" "hegren; flash; flash; sgren"
bind "KP_5" "vesthelm; vest"
bind "KP_RIGHTARROW" "defuser"
bind "KP_END" "famas; galil; primammo; vesthelm; vest; hegren; flash"
bind "KP_DOWNARROW" "mp5; primammo; vesthelm; vest; hegren; flash"

echo "=== USERCONFIG.CFG CARGADO CON EXITO ==="
