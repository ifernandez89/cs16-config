// ===================================================================
// Call of Duty: World at War - Nazi Zombies Classic Mode Config
// ===================================================================

echo "======================================================"
echo "  INICIANDO MODO NAZI ZOMBIES CLASSIC (CoD: WaW)"
echo "======================================================"

// --- Reglas de Juego & Equipos ---
mp_autoteambalance 0
mp_limitteams 0
mp_roundtime 99
mp_freezetime 2
mp_startmoney 500
mp_buytime 99
mp_c4timer 90
sv_maxspeed 350

// --- Inteligencia Artificial & Bots (Horda Zombi) ---
bot_join_team T
bot_knives_only 1
bot_difficulty 1
bot_quota 6

// --- Binds Directos de Supervivencia CoD ---
bind "p" "say /perks"
bind "b" "say /box"

// --- Reinicio de Simulación para Cargar Variables ---
sv_restart 1

echo "======================================================"
echo "  ¡MODO NAZI ZOMBIES LISTO!"
echo "  - Supervivientes: Facción CT (Anti-Terroristas)"
echo "  - Horda Zombi: Facción T (Terroristas con Cuchillo)"
echo "  - Tecla 'P' o escribe /perks para Máquina Perk-a-Cola"
echo "  - Tecla 'B' o escribe /box para Caja Misteriosa ($950)"
echo "  - Tecla 'E' (+use) para reparar barricadas y ganar puntos"
echo "======================================================"
